server:
  http_listen_port: 3101
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki.logging:3100/loki/api/v1/push

scrape_configs:
  # Payment Service Logs
  - job_name: payment-service
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - default
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: payment-service
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_version]
        action: replace
        target_label: version
      - source_labels: [__meta_kubernetes_pod_container_name]
        action: replace
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            request_id: request_id
      - labels:
          level:
          service:
          request_id:
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05Z07:00"
      - output:
          source: message

  # Transaction Service Logs
  - job_name: transaction-service
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - default
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: transaction-service
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_version]
        action: replace
        target_label: version
      - source_labels: [__meta_kubernetes_pod_container_name]
        action: replace
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            request_id: request_id
            transaction_id: transaction_id
      - labels:
          level:
          service:
          request_id:
          transaction_id:
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05Z07:00"
      - output:
          source: message

  # Notification Service Logs
  - job_name: notification-service
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - default
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: notification-service
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_version]
        action: replace
        target_label: version
      - source_labels: [__meta_kubernetes_pod_container_name]
        action: replace
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            request_id: request_id
            notification_type: notification_type
      - labels:
          level:
          service:
          request_id:
          notification_type:
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05Z07:00"
      - output:
          source: message

  # Kubernetes System Logs
  - job_name: kubernetes-cluster
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/logs/kubelet.log
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
